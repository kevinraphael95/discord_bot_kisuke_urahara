<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisuke Admin — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('kisuke-theme') || 'dark');
</script>
</head>
<body class="login">
<div class="login-wrap">
  <div class="login-brand"><span class="logo-mark">K</span> Kisuke Admin</div>
  <div class="login-box">
    <h1>Connexion</h1>
    <p>Panneau d'administration</p>
    {% if error %}<div class="note ko"><span>⚠</span><span class="note-body">{{ error }}</span></div>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">Mot de passe</label>
      <input class="field" id="password" type="password" name="password" autocomplete="current-password" autofocus required>
      <button class="btn btn-primary" type="submit">Se connecter</button>
    </form>
  </div>
  <div class="login-foot">v2.0 · Accès réservé</div>
</div>
</body>
</html>
