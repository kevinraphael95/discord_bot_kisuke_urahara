<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nope · YGO Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="utils/ygo.css">
<script src="utils/ygo.js"></script>
<style>
  /* Styles spécifiques pour la page 404 */
  .error-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 60vh;
    padding: 20px;
  }
  .nope-title {
    font-family: var(--font-display);
    font-size: clamp(4rem, 15vw, 8rem);
    color: var(--gold);
    margin: 0 0 10px;
    line-height: 1;
    text-shadow: 0 0 30px var(--gold-glow);
  }
  .video-container {
    width: 100%;
    max-width: 800px;
    aspect-ratio: 16 / 9;
    margin: 30px 0;
    border-radius: var(--radius);
    overflow: hidden;
    border: 2px solid var(--border);
    box-shadow: var(--shadow-lg);
  }
  .video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="index.html" title="Accueil">
      <div class="brand-logo"><i class="fa-solid fa-dragon"></i></div>
      <div>
        <div class="brand-name">YGO Tools</div>
        <div class="brand-sub">Boîte à outils Yu-Gi-Oh!</div>
      </div>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" type="button"></button>
    </div>
  </div>
</header>

<main class="container error-page">
  <h1 class="nope-title">Nope</h1>
  <p class="muted" style="font-size: 1.1rem; margin-bottom: 20px;">Cette page n'existe pas (ou plus).</p>
  
  <div class="video-container">
    <!-- L'ID de la vidéo Rick Roll : dQw4w9WgXcQ -->
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0" 
            title="Rick Roll" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>
  </div>

  <div class="actions" style="justify-content: center; margin-top: 20px;">
    <a class="btn btn-primary" href="index.html">
      <i class="fa-solid fa-house"></i> Retour à l'accueil
    </a>
  </div>
</main>

<footer class="app-footer">YGO Tools · tout s'exécute dans ton navigateur</footer>
<div class="toasts" id="toasts"></div>

</body>
</html>
