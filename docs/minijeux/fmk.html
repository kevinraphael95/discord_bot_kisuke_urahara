<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuck, Marry, Kill — Kisuke Urahara</title>

<script>
  (function() {
    const saved = localStorage.getItem('theme');
    const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || system);
  })();
</script>

<link rel="preload" href="../fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/shippori-mincho-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="minijeux.css">

<script src="../js/nav.js" defer></script>
<script src="../js/theme.js" defer></script>
<script src="../js/data.js"></script>
<script src="fmk.js" defer></script>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" data-nav="index">
      <span class="nav-logo-mark"><img src="assets/kisuke.jpg" alt="Kisuke"></span>
      Kisuke Urahara
    </a>
    <ul class="nav-links">
      <li><a data-nav="install">Installation</a></li>
      <li><a data-nav="commandes">Commandes</a></li>
      <li><a data-nav="guesser">Guesser</a></li>
      <li><a data-nav="minijeux">Mini-jeux</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-btn" id="themeBtn" aria-label="Changer le thème"></button>
      <button class="nav-burger" id="navBurger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="nav-mobile" id="navMobile">
  <a data-nav="install">Installation</a>
  <a data-nav="commandes">Commandes</a>
  <a data-nav="guesser">Guesser</a>
  <a data-nav="minijeux">Mini-jeux</a>
</div>

<header class="page-head">
  <h1>Fuck, Marry, <em>Kill</em></h1>
  <p>Un trio de personnages apparaît — à toi de faire tes choix.</p>
</header>

<main class="game-wrap">
  <div id="gameBox">
    <div class="cards-container" id="fmk-zone"></div>
    <div class="btn-row">
      <button class="btn-choice" id="btn-valider" onclick="validerChoix()" style="display:none">💥 Valider</button>
      <button class="btn-choice" onclick="genererTrio()">▶ Suivant</button>
    </div>
  </div>

  <div id="resultBox" class="result-box" style="display:none">
    <span class="res-emoji">🎯</span>
    <div class="res-title">Choix enregistrés !</div>
    <div class="res-info" id="fmkSummary"></div>
    <div class="btn-row">
      <button class="btn-choice" onclick="document.getElementById('resultBox').style.display='none';document.getElementById('gameBox').style.display='block';genererTrio();">▶ Rejouer</button>
    </div>
  </div>
</main>

</body>
</html>
