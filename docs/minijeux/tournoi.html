<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bracket Tournament — Kisuke Urahara</title>

<script>
  (function() {
    const saved = localStorage.getItem('theme');
    const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || system);
  })();
</script>

<link rel="preload" href="../fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/shippori-mincho-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="minijeux.css">

<script src="../js/nav.js" defer></script>
<script src="../js/theme.js" defer></script>
<script src="../js/data.js"></script>
<script src="tournoi.js" defer></script>
</head>
<body>

<header class="page-head">
  <h1>Bracket <em>Tournament</em></h1>
  <p>16 personnages Bleach s'affrontent — choisis ton préféré à chaque match.</p>
</header>

<main class="game-wrap">

  <!-- ZONE DE JEU -->
  <div id="gameBox" style="display:none">
    <div class="tl-header">
      <div class="tl-round-label" id="roundLabel">Tour 1 · Match 1/8</div>
      <div class="tl-round-title" id="roundTitle">Huitièmes de finale</div>
      <div class="tl-progress">
        <div class="tl-progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="match-zone" id="matchZone"></div>

    <div class="match-info" id="matchInfo"></div>

    <div class="btn-row">
      <button class="btn-choice" onclick="startTournament()">🔄 Restart</button>
    </div>
  </div>

  <!-- RÉSULTAT -->
  <div id="resultBox" class="result-box" style="display:none">
    <span class="res-emoji">🏆</span>
    <div class="res-title">Winner</div>
    <div id="winnerDisplay" style="display:flex;justify-content:center"></div>
    <div class="btn-row">
      <button class="btn-choice" onclick="startTournament()">▶ Rejouer</button>
    </div>
  </div>

</main>

</body>
</html>
