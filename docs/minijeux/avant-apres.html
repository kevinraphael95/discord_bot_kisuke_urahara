<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avant ou Après ? — Kisuke Urahara</title>

<script>
  (function() {
    const saved = localStorage.getItem('theme');
    const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || system);
  })();
</script>

<link rel="preload" href="../fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/shippori-mincho-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="minijeux.css">

<script src="../js/nav.js" defer></script>
<script src="../js/theme.js" defer></script>
<script src="avant-apres.js" defer></script>
</head>
<body>

<header class="page-head">
  <h1>Avant ou <em>Après</em> ?</h1>
  <p>La 2ème image vient avant ou après la première dans le manga ?</p>
</header>

<main class="game-wrap">

  <div id="loadBox" class="load-box">
    <div class="spinner"></div>
    <div id="loadMsg">Chargement des pages…</div>
    <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <div id="gameBox" style="display:none">
    <div class="images-row">
      <div class="img-card">
        <div class="img-label">Image 1 — référence</div>
        <img id="imgA" alt="Page de référence" />
      </div>
      <div class="vs-divider">
        <div class="vs-line"></div>
        <div class="vs-text">VS</div>
        <div class="vs-line"></div>
      </div>
      <div class="img-card">
        <div class="img-label">Image 2 — à situer</div>
        <img id="imgB" alt="Page à situer" />
      </div>
    </div>

    <div class="stats-row" style="margin-top:16px">
      <div class="sstat"><span class="sv" id="sStreak">0</span><span class="sl">Série 🔥</span></div>
      <div class="sstat"><span class="sv" id="sBest">0</span><span class="sl">Record</span></div>
    </div>

    <div class="btn-row">
      <button class="btn-choice" onclick="answer('before')">◀◀ Avant</button>
      <button class="btn-choice" onclick="answer('after')">▶▶ Après</button>
    </div>
  </div>

  <div id="resultBox" class="result-box" style="display:none">
    <span class="res-emoji">💀</span>
    <div class="res-title">Raté !</div>
    <div class="res-info">Tu as tenu <strong id="resStreak">0</strong> bonne(s) réponse(s)</div>
    <div class="res-record" id="resBest"></div>
    <div style="display:flex;gap:12px;width:100%">
      <div class="img-card" style="flex:1">
        <div class="img-label" id="resLabelA">—</div>
        <img id="resImgA" style="max-height:280px;width:100%;object-fit:contain" alt="" />
      </div>
      <div class="img-card" style="flex:1">
        <div class="img-label" id="resLabelB">—</div>
        <img id="resImgB" style="max-height:280px;width:100%;object-fit:contain" alt="" />
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-choice" onclick="restart()">▶ Rejouer</button>
    </div>
  </div>

  <div id="errorBox" class="error-box" style="display:none">
    <div id="errMsg">Impossible de charger les images.</div>
    <div class="btn-row">
      <button class="btn-choice" onclick="restart()">🔄 Réessayer</button>
    </div>
  </div>

</main>

</body>
</html>
