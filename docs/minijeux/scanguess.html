<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quel Tome ? — Kisuke Urahara</title>

<script>
  (function() {
    const saved = localStorage.getItem('theme');
    const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || system);
  })();
</script>

<link rel="preload" href="../fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/shippori-mincho-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="minijeux.css">

<script src="../js/nav.js" defer></script>
<script src="../js/theme.js" defer></script>
<script src="scanguess.js" defer></script>
</head>
<body>

<header class="page-head">
  <h1>De quel <em>tome</em> vient cette page ?</h1>
  <p>Devine le numéro du tome Bleach en 5 essais.</p>
</header>

<main class="game-wrap">
  <div class="pg-layout">

    <div class="pg-left">
      <div id="loadBox" class="load-box">
        <div class="spinner"></div>
        <div id="loadMsg">Chargement…</div>
        <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
      </div>
      <div id="errorBox" class="error-box" style="display:none">
        <div id="errMsg">Impossible de charger. Vérifie ta connexion.</div>
        <button class="btn-choice" onclick="newRound()">🔄 Réessayer</button>
      </div>
      <div id="imgBox" class="img-card" style="display:none">
        <img id="mangaImg" alt="Page de Bleach" />
      </div>
    </div>

    <div class="pg-right">
      <div class="stats-row">
        <div class="sstat"><span class="sv" id="sScore">0</span><span class="sl">Score</span></div>
        <div class="sstat"><span class="sv" id="sStreak">0</span><span class="sl">Série 🔥</span></div>
        <div class="sstat"><span class="sv" id="sBest">0</span><span class="sl">Record</span></div>
        <div class="sstat"><span class="sv" id="sRound">0</span><span class="sl">Manche</span></div>
      </div>
      <div style="display:flex;gap:6px;justify-content:center" id="triesRow"></div>
      <div id="inputBox" style="display:none">
        <div class="input-row">
          <input type="number" id="chapInput" placeholder="Tome (1 – 74)" min="1" max="74" onkeydown="if(event.key==='Enter') submit()" />
          <button class="btn-choice" onclick="submit()">Valider</button>
        </div>
      </div>
      <div id="histBox" style="display:flex;flex-direction:column;gap:4px"></div>
      <div id="result" class="result-box" style="display:none">
        <div class="res-title" id="resTtl"></div>
        <div class="res-info" id="resChap"></div>
        <button class="btn-choice" onclick="newRound()">▶ Prochaine page</button>
      </div>
    </div>

  </div>
</main>

</body>
</html>
