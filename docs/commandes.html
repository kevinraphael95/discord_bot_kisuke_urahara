<style>
  html { overflow-y: scroll; overflow-x: hidden; }

  .search-wrap {
    max-width: 520px;
    margin: 0 auto 40px;
    position: relative;
  }
  .search-wrap::before {
    content: '🔍';
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: .5;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 14px 18px 14px 48px;
    background: var(--bg-card);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-sm);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 15px;
    outline: none;
    transition: border-color .2s ease;
  }
  .search-input::placeholder { color: var(--fg-mute); }
  .search-input:focus { border-color: var(--accent); }

  .install-wrap {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 0 32px 80px;
    box-sizing: border-box;
  }

  #categories {
    display: flex;
    flex-direction: column;
    width: 100%;
    box-sizing: border-box;
  }

  #categories > .cat {
    width: 100%;
    box-sizing: border-box;
    margin: 0 0 12px 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-card);
    overflow: hidden;
  }
  #categories > .cat:hover { border-color: var(--line-2); }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .cat-header:hover { background: var(--bg-soft); }
  .cat-header::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform .25s;
    transform-origin: top;
  }
  .cat-header:hover::before,
  .cat-header.open::before { transform: scaleY(1); }

  .cat-icon { font-size: 18px; flex-shrink: 0; }
  .cat-name {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 800;
    color: var(--fg);
    flex: 1;
  }
  .cat-count {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 100px;
    min-width: 32px;
    text-align: center;
  }
  .cat-arrow {
    color: var(--fg-mute);
    font-size: 14px;
    transition: transform .25s;
  }
  .cat-header.open .cat-arrow { transform: rotate(90deg); color: var(--accent); }

  .cmd-list { display: none; padding: 4px 0 12px; border-top: 1px solid var(--line); }
  .cmd-list.open { display: block; }

  .cmd {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 20px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
  }
  .cmd:last-child { border-bottom: none; }
  .cmd:hover { background: var(--bg-soft); }

  .cmd-name {
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: flex-start;
    gap: 6px;
    word-break: break-word;
    line-height: 1.5;
  }
  .cmd-name::before {
    content: '';
    width: 5px; height: 5px;
    background: var(--accent);
    transform: rotate(45deg);
    flex-shrink: 0;
    margin-top: 7px;
  }
  .cmd-desc { font-size: 14px; color: var(--fg-soft); line-height: 1.6; }

  .cmd-usage {
    grid-column: 1 / -1;
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 6px 12px;
    border-radius: var(--radius-xs);
    border-left: 3px solid var(--accent);
    margin-top: 6px;
    display: block;
    box-sizing: border-box;
    word-break: break-word;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--fg-mute);
    font-size: 15px;
  }

  @media (max-width: 700px) {
    .install-wrap { padding: 0 16px 60px; }
    .cmd { grid-template-columns: 1fr; gap: 6px; padding: 14px 18px; }
    .cat-header { padding: 16px 18px; }
    .cat-name { font-size: 15px; }
  }
</style>
</head>

<header class="page-head">
  <h1>Toutes les <em>commandes</em></h1>
  <p>Organisées par catégorie. Utilise la recherche pour trouver une commande précise.</p>
</header>

<main class="install-wrap">

  <div class="search-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="Rechercher une commande…" autocomplete="off">
  </div>

  <div id="categories">
    <div class="loading">Chargement des commandes…</div>
  </div>

</main>

<footer>
  <div class="footer-inner">
    <span>© kevinraphael95 · MIT License</span>
  </div>
</footer>

<script>
const MD_URL = 'https://raw.githubusercontent.com/kevinraphael95/discord_bot_kisuke_urahara/main/usefull_stuff/Liste_des_Commandes.md';

const CAT_ICONS = {
  'admin':    '⚙️',
  'bleach':   '⚔️',
  'fun':      '🎲',
  'général':  '💬',
  'general':  '💬',
  'jeux':     '🕹️',
  'reiatsu':  '💠'
};

async function loadCommandes() {
  const container = document.getElementById('categories');

  try {
    const res = await fetch(MD_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const categories = parseMarkdown(md);

    if (!categories.length) {
      container.innerHTML = '<div class="loading">Aucune commande trouvée.</div>';
      return;
    }

    container.innerHTML = '';
    categories.forEach(cat => {
      const el = document.createElement('div');
      el.className = 'cat';
      el.innerHTML = `
        <div class="cat-header open">
          <span class="cat-icon">${cat.icon}</span>
          <span class="cat-name">${escapeHtml(cat.name)}</span>
          <span class="cat-count">${cat.commands.length}</span>
          <span class="cat-arrow">›</span>
        </div>
        <div class="cmd-list open">
          ${cat.commands.map(cmd => `
            <div class="cmd">
              <span class="cmd-name">${escapeHtml(cmd.name)}</span>
              <span class="cmd-desc">${escapeHtml(cmd.desc)}</span>
              ${cmd.usage ? `<code class="cmd-usage">${escapeHtml(cmd.usage)}</code>` : ''}
            </div>
          `).join('')}
        </div>
      `;
      container.appendChild(el);
    });

    document.querySelectorAll('.cat-header').forEach(h => {
      h.addEventListener('click', () => {
        h.classList.toggle('open');
        h.nextElementSibling.classList.toggle('open');
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      const val = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.cat').forEach(cat => {
        let count = 0;
        cat.querySelectorAll('.cmd').forEach(cmd => {
          const n = cmd.querySelector('.cmd-name').textContent.toLowerCase();
          const d = cmd.querySelector('.cmd-desc').textContent.toLowerCase();
          const ok = !val || n.includes(val) || d.includes(val);
          cmd.style.display = ok ? '' : 'none';
          if (ok) count++;
        });
        cat.style.display = count > 0 ? '' : 'none';
        cat.querySelector('.cat-count').textContent = count;
      });
    });

  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="loading">Impossible de charger les commandes.</div>';
  }
}

function parseMarkdown(md) {
  const lines = md.split('\n');
  const categories = [];
  let current = null;

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    // Catégorie : "## Nom" ou "### Nom" (avec ou sans 📂)
    const catMatch = line.match(/^#{2,3}\s+(.+)$/);
    if (catMatch) {
      let name = catMatch[1].trim().replace(/^[📂📁📌🔹]\s*/, '');
      const icon = CAT_ICONS[name.toLowerCase()] || '📁';
      current = { icon, name, commands: [] };
      categories.push(current);
      continue;
    }

    // Commande : "- nom : desc" ou "- **nom :** desc"
    const cmdMatch = line.match(/^[-*]\s+\*?\*?(.+?)\*?\*?\s*:\s*\*?\*?(.+?)\*?\*?$/);
    if (cmdMatch && current) {
      const name = cmdMatch[1].trim().replace(/^\*+|\*+$/g, '');
      let desc = cmdMatch[2].trim().replace(/^\*+|\*+$/g, '');
      let usage = null;
      const u = desc.match(/\s*Usage\s*:\s*(.+)$/i);
      if (u) {
        usage = u[1].trim();
        desc = desc.replace(/\s*Usage\s*:\s*.+$/i, '').trim();
      }
      current.commands.push({ name, desc, usage });
    }
  }

  return categories.filter(c => c.commands.length > 0);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.addEventListener('DOMContentLoaded', loadCommandes);
</script>
