# ================================================================================
# 📌 keep-alive.yml — GitHub Actions
# Objectif : Pinger le service toutes les X minutes pour éviter la veille
# Catégorie : CI/CD
# Accès : Public
# ================================================================================

# ================================================================================
# 📦 Nom du workflow (visible dans l'onglet "Actions" de GitHub)
# ================================================================================
name: Keep Bot Alive

# ================================================================================
# 🔔 Déclencheurs
# ================================================================================
on:
  # Exécution automatique toutes les X minutes (format cron UTC)
  # GitHub impose un minimum de 5 minutes entre deux exécutions.
  # 14 minutes laisse une marge de sécurité sous la limite des 15 minutes.
  schedule:
    - cron: '*/6 * * * *'

  # Permet de lancer le workflow manuellement depuis l'onglet "Actions"
  workflow_dispatch:

# ================================================================================
# 🛠️ Jobs
# ================================================================================
jobs:
  ping:
    # Machine virtuelle utilisée par GitHub pour exécuter le job
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # Étape 1 : Vérifier que l'URL est bien configurée
      # ------------------------------------------------------------------------
      - name: Vérification de la configuration
        run: |
          if [ -z "${{ vars.PING_URL }}" ]; then
            echo "⚠️ PING_URL n'est pas configurée. Le ping est ignoré."
            exit 0 # On quitte proprement sans faire d'erreur
          fi

      # ------------------------------------------------------------------------
      # Étape 2 : envoyer une requête HTTP GET vers l'URL publique du bot
      # ------------------------------------------------------------------------
      - name: Ping le service Render
        if: ${{ vars.PING_URL != '' }} # On ne ping que si la variable existe
        run: |
          # `curl` envoie la requête, ignore le corps de la réponse (-o /dev/null)
          # et affiche uniquement le code HTTP retourné (-w "%{http_code}")
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            ${{ vars.PING_URL }}
